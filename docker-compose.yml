services:
  app:
    build: .
    ports:
      - "3001:3000"
    env_file: .env
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: run_ranking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/infra/db/migrations/0001_initial.sql:/docker-entrypoint-initdb.d/01-init.sql
    restart: unless-stopped

volumes:
  pgdata:
